[package]
name = "pocket-embassy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Embassy pacing and asynchronous transport for PocketJS display outputs"

[features]
default = ["runner"]
runner = ["dep:pocket-runtime", "dep:embassy-time"]

[dependencies]
pocket-runtime = { workspace = true, optional = true }
pocket-drivers.workspace = true
embassy-time = { version = "0.5", optional = true }
