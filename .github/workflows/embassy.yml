name: Embassy host
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'platforms/embassy/**'
      - 'engine/guest-rquickjs/**'
      - 'engine/runtime/**'
      - 'engine/drivers/**'
      - 'engine/raster/**'
      - 'tests/fixtures/embassy-*/**'
      - '.github/workflows/embassy.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
permissions:
  contents: read
jobs:
  host-and-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install ARM C libraries and Rust target
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libclang-dev
          rustup target add thumbv7em-none-eabihf
      - name: Check platform boundaries without a C engine
        run: |
          cargo test -p pocket-embassy --no-default-features --locked
          cargo clippy -p pocket-embassy -p pocket-guest-rquickjs --all-targets --locked --no-deps -- -D warnings
      - name: Test the no_std guest
        run: cargo test -p pocket-guest-rquickjs --no-default-features --features rust-alloc --locked
      - name: Test and lint the host
        run: |
          cargo test --manifest-path tests/fixtures/embassy-host/Cargo.toml --release --locked
          cargo clippy --manifest-path tests/fixtures/embassy-host/Cargo.toml --release --locked --all-targets -- -D warnings
          cargo run --manifest-path tests/fixtures/embassy-host/Cargo.toml --release --locked
      - name: Link the bare-metal ARM fixture
        run: |
          python3 tests/fixtures/embassy-link/build.py thumbv7em-none-eabihf --cc arm-none-eabi-gcc
